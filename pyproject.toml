[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot-so101-act"
version = "0.1.0"
description = "LeRobot-v3-style dataset pipeline, ACT and lightweight language-conditioned policies for a simulated SO-101 pick-and-place task"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "陈彦希" }]
keywords = ["imitation-learning", "act", "lerobot", "so-101", "vla", "robotics"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26",
  "pillow>=10.0",
  "pyarrow>=14.0",
  "imageio>=2.34",
  "imageio-ffmpeg>=0.5",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
train = ["torch>=2.2"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
