name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install project dependencies
        run: pip install -r requirements.txt

      - name: Unit tests (>= 15)
        run: pytest -q

      - name: Generate a 3-episode mini dataset
        run: python scripts/generate_dataset.py --out data/ci_mini --episodes 3 --report reports/ci_mini_dataset.json

      - name: ACT smoke training (200-step scale, <= 2 minutes on CPU)
        run: |
          python scripts/train_act.py --smoke --dataset data/ci_mini \
            --report reports/ci_train_act_smoke.json \
            --out checkpoints/act_smoke.pt

      - name: Evaluation smoke test
        run: |
          python scripts/eval_policy.py --policy act --checkpoint checkpoints/act_smoke.pt --smoke
